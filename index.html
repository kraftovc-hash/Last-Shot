<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shorts &amp; Guns</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#140d1c;--gold:#ffd23f;--mint:#3ddc97;--pan2:#241c2c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html,body{height:100%;margin:0;background:var(--ink);font-family:'Lilita One',system-ui,sans-serif;color:#fff;overflow:hidden}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--pan2)}
.top{display:flex;gap:6px;padding:8px 8px 4px;position:absolute;top:0;left:0;right:0;z-index:3}
.cur{flex:1;background:#140d1ccc;border:2px solid #5d4a70;border-radius:16px;padding:3px 8px;font-size:17px;text-align:center}
#lvl{position:absolute;top:44px;left:0;right:0;text-align:center;z-index:3;font-size:19px;text-shadow:0 2px 0 #000;pointer-events:none}
#lvl>div:first-child{display:flex;justify-content:center;align-items:center;gap:10px}
.ar{pointer-events:auto;background:#140d1ccc;border:2px solid #5d4a70;border-radius:12px;color:#fff;font:inherit;font-size:15px;padding:0 9px;cursor:pointer}
#dots{display:flex;gap:7px;justify-content:center;align-items:center;margin-top:3px}
#dots i{width:12px;height:12px;border-radius:50%;background:#ffffff55;border:2px solid #fff}
#dots i.on{background:var(--gold);border-color:#fff8c8}
#dots b{font-size:22px;font-weight:400}
#scene{position:relative;flex:1;min-height:200px;overflow:hidden}
#scene .bg{position:absolute;inset:0;width:100%;height:100%}
.ent{position:absolute;bottom:19%}
.ent img{display:block;height:100%;width:auto;max-width:none}.ent svg{display:block;width:100%;height:100%;overflow:visible}
.walk svg,.walk img{animation:bob .45s infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.hit svg,.hit img{animation:hit .12s}
@keyframes hit{50%{filter:brightness(2.4)}}
.appear{animation:appear .3s both}@keyframes appear{from{opacity:0;transform:translateX(50px)}}
.hurt{animation:hurt .15s}@keyframes hurt{50%{filter:brightness(1.9) saturate(2.2) hue-rotate(-35deg)}}
.tr.e{background:#ffb347;box-shadow:0 0 8px #ff4d5a;animation-duration:.13s}
.eh{position:absolute;left:12%;right:12%;top:-9px;height:6px;background:#000a;border-radius:4px;overflow:hidden;border:1px solid #0008}.eh i{display:block;height:100%;width:100%;background:linear-gradient(#ff7b86,#ff4d5a)}
#tm{position:absolute;top:92px;left:50%;transform:translateX(-50%);z-index:3;background:#140d1ccc;border:2px solid #5d4a70;border-radius:14px;padding:1px 14px;font-size:21px;display:none;pointer-events:none}
#tm.on{display:block}#tm.low{border-color:#ff4d5a;color:#ff9aa2;animation:pulse .6s infinite}
.bl{position:absolute;height:4px;width:26px;margin:-2px 0 0 -26px;border-radius:3px;pointer-events:none;transform-origin:100% 50%;z-index:6}
.bl.h{background:linear-gradient(90deg,#7df9ff00,#fff 75%,#fff);box-shadow:0 0 9px #7df9ff}
.bl.e{background:linear-gradient(90deg,#ff4d5a00,#ffb347 75%,#fff);box-shadow:0 0 9px #ff4d5a}
.mf,.sp{position:absolute;border-radius:50%;pointer-events:none;z-index:7}
.mf{width:30px;height:30px;background:radial-gradient(#fff 18%,#ffd23f 45%,#ff8a0000 72%)}
.sp{width:22px;height:22px;background:radial-gradient(#fff 15%,#ffb347 50%,#ff4d5a00 72%)}
.recoil svg,.recoil>img,.recoil>.eb{animation:rec .1s}
.ent .eb{position:relative;width:100%;height:100%}.ent .eb img{position:absolute;left:0;top:0;width:100%;height:100%}
.ent .eb img.fa{transform-origin:38.86% 39.78%;transition:transform .17s ease-out}
@keyframes rec{50%{transform:translateX(-5px)}}
.dmg{position:absolute;color:#fff;font-size:22px;text-shadow:0 2px 0 #000;animation:fl .7s forwards;pointer-events:none}
.dmg.c{color:var(--gold);font-size:30px}
.dmg.p{color:#ff6b78;font-size:26px}
#turn{position:absolute;top:128px;left:50%;transform:translateX(-50%);z-index:3;background:#140d1ccc;border:2px solid #5d4a70;border-radius:14px;padding:1px 12px;font-size:16px;line-height:19px;display:none;pointer-events:none;text-align:center;white-space:nowrap}
#turn.on{display:block}#turn.h{border-color:#7df9ff}#turn.e{border-color:#ff4d5a}
@keyframes fl{to{transform:translateY(-45px);opacity:0}}
.tr{position:absolute;height:3px;background:#fff;border-radius:2px;box-shadow:0 0 8px #7df9ff;animation:tr .1s forwards;pointer-events:none}
@keyframes tr{to{opacity:0}}
.hpb{position:absolute;left:10px;right:10px;bottom:8px;height:12px;background:#0008;border-radius:8px;overflow:hidden;border:2px solid #0006}
.hpb i{display:block;height:100%;width:100%;background:linear-gradient(#ff7b86,#ff4d5a)}
#boss{position:absolute;left:58%;bottom:24px;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;border:0;font:inherit;font-size:26px;line-height:28px;background:radial-gradient(#c9a84e,#8a6618);box-shadow:0 0 0 4px #ffffff30,0 0 14px #b88a1e88;z-index:2;color:#2a1c08;animation:pulse 1.4s infinite;cursor:pointer}
#boss small{display:block;font-size:14px;line-height:14px}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.08)}}
#panel{background:linear-gradient(#4a3d56,#241c2c);border-top:4px solid #6b5a78;padding:8px 8px 6px}
.lvrow{display:flex;align-items:center;gap:8px;font-size:17px}
.xp{flex:1;height:18px;background:#0008;border-radius:9px;overflow:hidden;position:relative;border:2px solid #0006}
.xp i{display:block;height:100%;background:linear-gradient(#ffb347,#ff8a00);width:0}
.xp span{position:absolute;inset:0;text-align:center;font-size:13px;line-height:14px}
.stats{display:flex;justify-content:space-around;font-size:19px;margin:5px 0}
#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.slot{aspect-ratio:1;border-radius:10px;border:3px solid #888;background:linear-gradient(#5b4a63,#32283a);position:relative;font-size:24px;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;color:#fff;cursor:pointer;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:contain}
.slot.e span,.slot.e img{opacity:.25;filter:grayscale(1)}
.slot em{position:absolute;left:0;right:0;bottom:0;font-size:12px;font-style:normal;background:#000a;line-height:14px}
.slot.r8{animation:glow 1.4s infinite}
@keyframes glow{50%{box-shadow:0 0 14px 3px #ffe066}}
.foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
.mb{background:none;border:0;color:#fff;font:inherit;font-size:15px;text-align:center;width:62px;cursor:pointer}
.mb span{display:block;font-size:32px;line-height:38px}
#chest{width:150px;border:0;font:inherit;color:#fff;background:none;text-align:center;cursor:pointer;margin-top:-24px}
#chest .box{height:96px;filter:drop-shadow(0 0 14px #ff4a1f)}#chest .box svg{height:100%;width:auto;display:block;margin:0 auto}
#chest .pr{display:inline-block;background:#140d1c;border:2px solid var(--gold);border-radius:14px;padding:1px 16px;font-size:20px}
#chest:active .box{transform:scale(.9)}
#chest.z .box{filter:grayscale(1) opacity(.5)}
#drop{position:absolute;left:50%;top:26%;transform:translateX(-50%);z-index:6;pointer-events:none}
.dc{background:#140dc;background:#140d1cee;border:3px solid;border-radius:18px;padding:10px 20px;text-align:center;font-size:19px;animation:pop .25s;min-width:190px}
@keyframes pop{from{transform:scale(.5);opacity:0}}
#toast{position:absolute;left:50%;top:42%;transform:translateX(-50%);background:#140d1cee;border:2px solid var(--gold);border-radius:16px;padding:8px 16px;font-size:19px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;text-align:center;max-width:90%}
#toast.on{opacity:1}
#modal{position:absolute;inset:0;background:#140d1ccc;display:none;align-items:center;justify-content:center;z-index:8}
#modal.on{display:flex}
.mc{background:#3a2f46;border:3px solid #6b5a78;border-radius:20px;padding:14px;width:88%;max-height:80%;overflow:auto;font-size:19px}
.mc h3{margin:0 0 10px;font-weight:400;font-size:26px;text-align:center}
.q{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #ffffff22}
.q small{display:block;font-size:14px;color:#cbb8de}
.btn{font:inherit;font-size:17px;color:#140d1c;background:var(--mint);border:0;border-bottom:4px solid #1f9e6c;border-radius:14px;padding:7px 14px;cursor:pointer}
.btn[disabled]{background:#8d7d99;border-bottom-color:#6b5a78;color:#ddd}
</style></head><body>

const CFG={edmg:.14,   /* урон врагов: больше = больнее */

};
/* мир и этап по сквозному номеру уровня n; босс на каждом 5-м этапе */
function pos(n){let w=1,r=n;for(;;){const len=CFG.worlds[Math.min(w-1,CFG.worlds.length-1)];if(r<=len)return{w,s:r,len,b:(r-1)%5+1,boss:r%5==0};r-=len;w++}}
const FA={px:0.3886,py:0.3978,mx:0.0459,my:0.7012,bar:123.69}; /* точка вращения руки, дуло и угол ствола на картинке */
function muzzle(e,th){
 const H=F.sc.clientHeight,ew=e.el.offsetWidth,eh=e.el.offsetHeight,t=th*Math.PI/180,top=H*(1-e.b/100)-eh,px=FA.px*ew,py=FA.py*eh,rx=FA.mx*ew-px,ry=FA.my*eh-py;
 return {x:e.x+px+rx*Math.cos(t)-ry*Math.sin(t),y:top+py+rx*Math.sin(t)+ry*Math.cos(t)};
}
function aimAngle(e){
 const H=F.sc.clientHeight,tx=F.he.offsetLeft+F.he.offsetWidth*.42,ty=H*.81-F.he.offsetHeight*.55;let th=55;
 for(let k=0;k<4;k++){const m=muzzle(e,th);let a=Math.atan2(ty-m.y,tx-m.x)*180/Math.PI;if(a<0)a+=360;th=Math.max(25,Math.min(85,a-FA.bar))}
 return th;
}
function raise(e){e.th=aimAngle(e);e.arm.style.transform=`rotate(${e.th}deg)`}
function lower(e){setTimeout(()=>{if(!e.bl&&e.arm)e.arm.style.transform='rotate(0deg)'},380)}
function fx(x,y,c){const d=document.createElement('div');d.className=c;d.style.left=x+'px';d.style.top=y+'px';F.sc.appendChild(d);return d}
function flash(x,y){const d=fx(x-15,y-15,'mf');d.animate([{opacity:1,transform:'scale(.6)'},{opacity:0,transform:'scale(1.6)'}],{duration:130}).onfinish=()=>d.remove()}
function spark(x,y){const d=fx(x-11,y-11,'sp');d.animate([{opacity:1,transform:'scale(.4)'},{opacity:0,transform:'scale(1.7)'}],{duration:170}).onfinish=()=>d.remove()}
function bullet(x0,y0,x1,y1,c){
 const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy),a=Math.atan2(dy,dx)*180/Math.PI,b=fx(x0,y0,'bl '+c);
 b.animate([{transform:`rotate(${a}deg) translateX(0px)`},{transform:`rotate(${a}deg) translateX(${L}px)`}],{duration:Math.max(60,L/CFG.bspd*1000),easing:'linear'}).onfinish=()=>{b.remove();spark(x1,y1)};
}
function wave(){
 const n=S.cur,P=pos(n),s=P.b,boss=P.boss,wd=(P.w-1)%3,q=[];
 const ref=CFG.refdps*(1+CFG.refgrow*(n-1)),base=ref*CFG.time/CFG.tmul;
 const mk=(big,hp,am,ty,sh)=>({hp,at:(2.5+.7*n)*am,big,ty,wd,sh,gold:Math.ceil((1+n/2)*(big?5:1))});
 if(boss)q.push(mk(1,base*CFG.bosshp,CFG.bossat,0,CFG.bossshots));
 else{const c=Math.min(CFG.emax,CFG.emin+Math.ceil(n/CFG.eper));for(let i=0;i<c;i++)q.push(mk(0,base/c,1,(i+n)%3,CFG.eshots))}
 Object.assign(F,{q:[],t:0,boss,hp:F.max,fight:1,tmax:CFG.time,dealt:0,taken:0,tb:0,turn:'w',next:'h',who:'h',tt:.6,tot:q.reduce((a,e)=>a+e.hp,0)});
 F.tl=F.tmax;
 const W=F.sc.clientWidth,many=q.length>4,B=[19,15,23],Z=[2,3,1];
 q.forEach((e,i)=>{
  const row=i%3,col=i/3|0,el=document.createElement('div');
  el.className='ent appear';el.style.animationDelay=(i*45)+'ms';
  el.style.height=e.big?(ART.boss?'42%':'48%'):(many?'33%':(ART.foe?'38%':'31%'));
  el.style.aspectRatio=e.big?(ART.boss?'413/400':'160/170'):(ART.foe?'298/420':'120/140');
  el.style.bottom=B[row]+'%';el.style.zIndex=Z[row];
  el.innerHTML=foe(e.ty,e.big,e.wd)+'<div class="eh"><i></i></div>';
  F.sc.appendChild(el);
  e.el=el;e.hb=el.querySelector('.eh i');e.max=e.hp;e.b=B[row];e.arm=el.querySelector('.fa');e.th=0;
  e.x=W*.98-el.offsetWidth-col*W*.14-(row==1?W*.05:0);
  if(e.big&&ART.boss)e.x=W-el.offsetWidth+12;

 const H=F.sc.clientHeight,hx=F.he.offsetLeft+(ART.hero?F.he.firstElementChild.offsetWidth:F.he.offsetWidth*.97),hy=H*.81-F.he.offsetHeight*(ART.hero?.6:.56);

 const f=document.createElement('div');f.className='dmg'+(cr?' c':'');f.textContent=(cr?'💥':'')+fmt(d);f.style.cssText=`left:${t.x+t.el.offsetWidth*.3}px;top:${hy-70}px`;F.sc.appendChild(f);setTimeout(()=>f.remove(),700);
 t.el.classList.remove('hit');void t.el.offsetWidth;t.el.classList.add('hit');

function efire(e){
 const H=F.sc.clientHeight,eh=e.el.offsetHeight;let x0=e.x+e.el.offsetWidth*(ART.foe&&!e.big?.02:.05),y0=H*(1-e.b/100)-eh*(ART.foe&&!e.big?.30:.5);

 const tx=F.he.offsetLeft+F.he.offsetWidth*.42,ty=H*.81-F.he.offsetHeight*.55+(Math.random()-.5)*14;
 flash(x0,y0);bullet(x0,y0,tx,ty,'e');
 const dm=Math.max(.3,e.at*CFG.edmg*100/(100+F.st.ar*3))*2.4/e.sh;if(!DBG.god)F.hp-=dm;F.taken+=dm;F.tb+=dm;

function loop(now){
 const dt=Math.min(.05,(now-F.last)/1000);F.last=now;F.t+=dt;
 if(F.fight){
  if(F.turn=='h'){ /* ход героя: серия выстрелов */
   F.tt-=dt;
   if(F.tt<=0&&F.en.length){shoot();F.k--;F.tt=F.st.r/1000*.25*CFG.hrate;if(F.k<=0){F.turn='w';F.next='e';F.who='e';F.tt=CFG.gap}}
  }else if(F.turn=='e'){ /* ход врагов: каждый даёт свою очередь */
   let act=0;
   for(const e of F.en)if(e.bl>0){act=1;e.bt-=dt;if(e.bt<=0){efire(e);e.bl--;e.bt=.14;if(!e.bl&&e.arm)lower(e)}}
   if(!act){if(F.tb>0){hdmg(F.tb);F.tb=0}F.turn='w';F.next='h';F.who='h';F.tt=CFG.gap}
  }else{ /* пауза между ходами */
   F.tt-=dt;
   if(F.tt<=0){
    if(F.next=='h'){F.turn='h';F.k=CFG.hshots;F.tt=0}
    else{F.turn='e';let i=0;for(const e of F.en){e.bl=e.sh;e.bt=(e.arm?.22:0)+(i++)*CFG.estag;if(e.arm)raise(e)}}
   }
  }
  if(!DBG.notime)F.tl-=dt;
  const tm=$('#tm');tm.textContent='⏱ '+Math.max(0,Math.ceil(F.tl));tm.classList.add('on');tm.classList.toggle('low',F.tl<=5);
  turnUI();
 }
 F.he.classList.toggle('walk',!F.en.length);
 $('#hp').style.width=Math.max(0,F.hp/F.max*100)+'%';
 if(F.fight&&F.hp<=0)lose('Поражение! Нанесено '+fmt(F.dealt)+', получено '+fmt(F.taken)+'. Усилься!');
 else if(F.fight&&F.en.length&&F.tl<=0){const left=Math.round(F.en.reduce((a,e)=>a+Math.max(0,e.hp),0)/F.tot*100);lose('Время вышло! Врагов осталось '+left+'%. Усилься, чтобы бить сильнее');}
 else if(F.fight&&!F.en.length){
  F.fight=0;S.qp.w++;let m='Победа! ⚔'+fmt(F.dealt)+' 🩸'+fmt(F.taken);$('#tm').classList.remove('on','low');turnUI();
  if(S.cur==S.n){const c=F.boss?8:3;S.cr+=c;S.n++;S.cur=S.n;m+=' +📦×'+c;if(F.boss)S.gems+=5}
  toast(m);save();ui();
 }
 requestAnimationFrame(loop);
}
/* без зума: щипок и двойной тап (touch-action в CSS отключает двойной тап, остальное тут) */
['gesturestart','gesturechange','gestureend','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));

/* ---------- тестовая панель: 5 быстрых нажатий на счётчик ⚔ сверху или ?debug в адресе ---------- */
const DBG={god:0,x10:0,notime:0};
function nOf(w,s){let n=0;for(let i=1;i<w;i++)n+=CFG.worlds[Math.min(i-1,CFG.worlds.length-1)];return n+s}
function dbg(){
 const b=(id,t)=>`<button class="btn" data-d="${id}" style="margin:3px">${t}</button>`,tg=(k,t)=>b(k,(DBG[k]?'✅ ':'⬜ ')+t),P=pos(S.cur),inp=(id,v)=>`<input id="${id}" type="number" min="1" value="${v}" style="width:54px;font:inherit;font-size:18px;text-align:center">`;
 $('#mc').innerHTML='<h3>🛠 Тест</h3><div style="text-align:center">'+b('cr','📦 +100 ящиков')+b('gold','🪙 +10000 · 💎 +100')+b('pl','⬆ Ур. игрока +5')+
  '<div style="margin:6px 0">Надеть всё:</div>'+b('e2','Редкое')+b('e4','Легенд.')+b('e8','Божеств.')+
  '<div style="margin:6px 0">Режимы:</div>'+tg('god','Бессмертие')+tg('x10','Урон ×10')+tg('notime','Без таймера')+
  '<div style="margin:8px 0">Уровень: '+inp('dw',P.w)+' - '+inp('ds',P.s)+' '+b('go','Перейти')+'</div>'+b('rs','🗑 Сброс')+b('x','Закрыть')+'</div>';
 $('#modal').classList.add('on');
 document.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{
  const k=x.dataset.d;
  if(k=='cr')S.cr+=100;
  else if(k=='gold'){S.gold+=10000;S.gems+=100}
  else if(k=='pl')S.pl+=5;
  else if(k[0]=='e'){const r=+k.slice(1);for(const d of SL)S.it[d[0]]={r,lv:S.pl+2}}
  else if(k in DBG)DBG[k]^=1;
  else if(k=='go'){
   if(F.fight)return toast('Сначала закончи бой');
   const w=Math.max(1,+$('#dw').value|0),len=CFG.worlds[Math.min(w-1,CFG.worlds.length-1)],n=nOf(w,Math.min(len,Math.max(1,+$('#ds').value|0)));
   S.n=Math.max(S.n,n);S.cur=n}
  else if(k=='rs'){try{localStorage.removeItem('sg3')}catch(e){}location.reload();return}
  else if(k=='x'){$('#modal').classList.remove('on');return}
  save();ui();dbg();
 });
}
let dbgT=0,dbgC=0;
$('#c3').onclick=()=>{const t=Date.now();dbgC=t-dbgT<800?dbgC+1:1;dbgT=t;if(dbgC>=5){dbgC=0;dbg()}};
if(/debug/.test(location.search))setTimeout(dbg,300);

start();
</script></body></html>
