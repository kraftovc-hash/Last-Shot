<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shorts &amp; Guns</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#140d1c;--gold:#ffd23f;--mint:#3ddc97;--pan2:#241c2c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--ink);font-family:'Lilita One',system-ui,sans-serif;color:#fff;overflow:hidden}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--pan2)}
.top{display:flex;gap:6px;padding:8px 8px 4px;position:absolute;top:0;left:0;right:0;z-index:3}
.cur{flex:1;background:#140d1ccc;border:2px solid #5d4a70;border-radius:16px;padding:3px 8px;font-size:17px;text-align:center}
#lvl{position:absolute;top:44px;left:0;right:0;text-align:center;z-index:3;font-size:19px;text-shadow:0 2px 0 #000;pointer-events:none}
#lvl>div:first-child{display:flex;justify-content:center;align-items:center;gap:10px}
.ar{pointer-events:auto;background:#140d1ccc;border:2px solid #5d4a70;border-radius:12px;color:#fff;font:inherit;font-size:15px;padding:0 9px;cursor:pointer}
#dots{display:flex;gap:7px;justify-content:center;align-items:center;margin-top:3px}
#dots i{width:12px;height:12px;border-radius:50%;background:#ffffff55;border:2px solid #fff}
#dots i.on{background:var(--gold);border-color:#fff8c8}
#dots b{font-size:22px;font-weight:400}
#scene{position:relative;flex:1;min-height:200px;overflow:hidden}
#scene .bg{position:absolute;inset:0;width:100%;height:100%}
.ent{position:absolute;bottom:19%}
.ent svg{display:block;width:100%;height:100%;overflow:visible}
.walk svg{animation:bob .45s infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.hit svg{animation:hit .12s}
@keyframes hit{50%{filter:brightness(2.4)}}
.recoil svg{animation:rec .1s}
@keyframes rec{50%{transform:translateX(-5px)}}
.dmg{position:absolute;color:#fff;font-size:22px;text-shadow:0 2px 0 #000;animation:fl .7s forwards;pointer-events:none}
.dmg.c{color:var(--gold);font-size:30px}
@keyframes fl{to{transform:translateY(-45px);opacity:0}}
.tr{position:absolute;height:3px;background:#fff;border-radius:2px;box-shadow:0 0 8px #7df9ff;animation:tr .1s forwards;pointer-events:none}
@keyframes tr{to{opacity:0}}
.hpb{position:absolute;left:10px;right:10px;bottom:8px;height:12px;background:#0008;border-radius:8px;overflow:hidden;border:2px solid #0006}
.hpb i{display:block;height:100%;width:100%;background:linear-gradient(#ff7b86,#ff4d5a)}
#boss{position:absolute;left:58%;bottom:24px;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;border:0;font:inherit;font-size:26px;line-height:28px;background:radial-gradient(#c9a84e,#8a6618);box-shadow:0 0 0 4px #ffffff30,0 0 14px #b88a1e88;z-index:2;color:#2a1c08;animation:pulse 1.4s infinite;cursor:pointer}
#boss small{display:block;font-size:14px;line-height:14px}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.08)}}
#panel{background:linear-gradient(#4a3d56,#241c2c);border-top:4px solid #6b5a78;padding:8px 8px 6px}
.lvrow{display:flex;align-items:center;gap:8px;font-size:17px}
.xp{flex:1;height:18px;background:#0008;border-radius:9px;overflow:hidden;position:relative;border:2px solid #0006}
.xp i{display:block;height:100%;background:linear-gradient(#ffb347,#ff8a00);width:0}
.xp span{position:absolute;inset:0;text-align:center;font-size:13px;line-height:14px}
.stats{display:flex;justify-content:space-around;font-size:19px;margin:5px 0}
#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.slot{aspect-ratio:1;border-radius:10px;border:3px solid #888;background:linear-gradient(#5b4a63,#32283a);position:relative;font-size:24px;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;color:#fff;cursor:pointer;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:contain}
.slot.e span{opacity:.25;filter:grayscale(1)}
.slot em{position:absolute;left:0;right:0;bottom:0;font-size:12px;font-style:normal;background:#000a;line-height:14px}
.slot.r8{animation:glow 1.4s infinite}
@keyframes glow{50%{box-shadow:0 0 14px 3px #ffe066}}
.foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
.mb{background:none;border:0;color:#fff;font:inherit;font-size:15px;text-align:center;width:62px;cursor:pointer}
.mb span{display:block;font-size:32px;line-height:38px}
#chest{width:150px;border:0;font:inherit;color:#fff;background:none;text-align:center;cursor:pointer;margin-top:-24px}
#chest .box{height:96px;filter:drop-shadow(0 0 14px #ff4a1f)}#chest .box svg{height:100%;width:auto;display:block;margin:0 auto}
#chest .pr{display:inline-block;background:#140d1c;border:2px solid var(--gold);border-radius:14px;padding:1px 16px;font-size:20px}
#chest:active .box{transform:scale(.9)}
#chest.z .box{filter:grayscale(1) opacity(.5)}
#drop{position:absolute;left:50%;top:26%;transform:translateX(-50%);z-index:6;pointer-events:none}
.dc{background:#140dc;background:#140d1cee;border:3px solid;border-radius:18px;padding:10px 20px;text-align:center;font-size:19px;animation:pop .25s;min-width:190px}
@keyframes pop{from{transform:scale(.5);opacity:0}}
#toast{position:absolute;left:50%;top:42%;transform:translateX(-50%);background:#140d1cee;border:2px solid var(--gold);border-radius:16px;padding:8px 16px;font-size:19px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;text-align:center;max-width:90%}
#toast.on{opacity:1}
#modal{position:absolute;inset:0;background:#140d1ccc;display:none;align-items:center;justify-content:center;z-index:8}
#modal.on{display:flex}
.mc{background:#3a2f46;border:3px solid #6b5a78;border-radius:20px;padding:14px;width:88%;max-height:80%;overflow:auto;font-size:19px}
.mc h3{margin:0 0 10px;font-weight:400;font-size:26px;text-align:center}
.q{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #ffffff22}
.q small{display:block;font-size:14px;color:#cbb8de}
.btn{font:inherit;font-size:17px;color:#140d1c;background:var(--mint);border:0;border-bottom:4px solid #1f9e6c;border-radius:14px;padding:7px 14px;cursor:pointer}
.btn[disabled]{background:#8d7d99;border-bottom-color:#6b5a78;color:#ddd}
</style></head><body>

const $=s=>document.querySelector(s);
const ART={}; /* позже: ART.hero, ART.foe, ART.boss, ART.slot0…slot11 = ссылки на картинки */
const SL=[["w","🔫","Оружие",1.6,0,0],["hd","🪖","Шлем",0,3,.5],["b","🦺","Бронежилет",0,5,1],["sh","🛡","Наплечники",0,2,.6],["g","🧤","Перчатки",.4,1,0],["k","👢","Ботинки",0,2,.3],["p","🎒","Рюкзак",0,3,0],["bt","🔗","Пояс",0,2,.3],["ms","😷","Маска",0,1,.6],["kn","🦵","Наколенники",0,1,.5],["am","🔮","Амулет",.5,0,0],["md","⚡","Модуль",.6,0,.2]];

const RE=["Common","Uncommon","Rare","Epic","Legendary","Mythic","Supreme","Immortal","Divine"];
const RC=['#9a9a9a','#4cd964','#4aa3ff','#b361ff','#ff9a2e','#ff4d5a','#ff4dd2','#20e0e0','#ffe066'];

try{Object.assign(S,JSON.parse(localStorage.sg3||'{}'))}catch(e){}
const save=()=>{try{localStorage.sg3=JSON.stringify(S)}catch(e){}};
const pw=it=>it.lv*RM[it.r];
const tierOf=k=>{const it=S.it[k];return !it?0:it.r<=2?1:it.r<=5?2:3};
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':Math.round(n);
const need=L=>10+8*(L-1)+3*(L-1)*(L-1);
const stats=()=>{let d=6,hp=50,ar=0;for(const [k,,,cd,ch,ca] of SL){const it=S.it[k];if(it){const p=pw(it);d+=p*cd;hp+=p*ch;ar+=p*ca}}return{d:Math.round(d),hp:Math.round(hp),ar:Math.round(ar),r:Math.max(320,650-S.pl*6)}};

}

/* ---------- враги ---------- */
const PAL=[['#5d8a3c','#2f4a1c'],['#8a4fc0','#4a2a70'],['#c45a30','#6e2a12']];
function foe(ty,big,wd){
 if(ART[big?'boss':'foe'])return `<img src="${ART[big?'boss':'foe']}" style="height:100%">`;
 const [C,D]=PAL[wd];
 if(big)return `<svg viewBox="0 0 160 170"><ellipse cx="84" cy="164" rx="56" ry="7" fill="#0005"/>

 <ellipse cx="52" cy="58" rx="38" ry="30" fill="${C}"/><polygon points="24,40 10,6 40,32" fill="${D}"/><polygon points="64,34 74,2 80,38" fill="${D}"/>
 <circle cx="34" cy="50" r="5" fill="#ff2a2a"/><circle cx="48" cy="46" r="5" fill="#ff2a2a"/><circle cx="62" cy="50" r="4" fill="#ff2a2a"/><circle cx="26" cy="62" r="3" fill="#ff2a2a"/>

 if(ty==0)return `<svg viewBox="0 0 120 140"><ellipse cx="60" cy="135" rx="38" ry="6" fill="#0005"/>
 <path d="M92 100 Q120 96 116 66 Q112 92 90 94Z" fill="${D}"/>
 <polygon points="66,56 74,26 84,56" fill="${D}"/><polygon points="84,60 98,36 100,66" fill="${D}"/><polygon points="52,60 54,34 64,56" fill="${D}"/>
 <rect x="50" y="96" width="16" height="40" rx="6" fill="${D}"/><rect x="80" y="96" width="16" height="40" rx="6" fill="${D}"/>
 <ellipse cx="74" cy="82" rx="32" ry="28" fill="${C}"/>
 <path d="M60 76 Q38 86 14 106" stroke="${C}" stroke-width="12" fill="none" stroke-linecap="round"/>
 <path d="M14 106 l-9 5 M14 106 l-4 12 M14 106 l3 -13" stroke="#e8e8d8" stroke-width="3" stroke-linecap="round"/>
 <path d="M32 40 Q4 46 6 68 Q30 62 56 72 Q64 52 52 38Z" fill="${C}"/>
 <path d="M9 66 l5 8 l5-7 l5 8 l5-7 l5 8 l5-7 l5 7" stroke="#fff" fill="none" stroke-width="2.5"/>
 <circle cx="30" cy="52" r="4" fill="#ff2a2a"/><circle cx="42" cy="50" r="4" fill="#ff2a2a"/><circle cx="30" cy="52" r="8" fill="#ff2a2a" opacity=".3"/></svg>`;
 if(ty==1)return `<svg viewBox="0 0 120 140"><ellipse cx="62" cy="135" rx="44" ry="6" fill="#0005"/>
 <path d="M50 96 L28 132 M62 100 L48 134 M84 100 L98 134 M98 94 L114 128" stroke="${D}" stroke-width="7" fill="none" stroke-linecap="round"/>
 <ellipse cx="72" cy="86" rx="36" ry="24" fill="${C}"/><ellipse cx="78" cy="72" rx="24" ry="10" fill="${D}"/>
 <circle cx="34" cy="82" r="21" fill="${C}"/>
 <circle cx="26" cy="72" r="4" fill="#ffe14a"/><circle cx="36" cy="66" r="3.5" fill="#ffe14a"/><circle cx="44" cy="74" r="3" fill="#ffe14a"/><circle cx="22" cy="82" r="3" fill="#ffe14a"/><circle cx="36" cy="80" r="2.5" fill="#ffe14a"/>
 <polygon points="16,90 2,108 22,100" fill="#fff"/><polygon points="24,98 14,118 30,104" fill="#fff"/></svg>`;
 return `<svg viewBox="0 0 120 140"><ellipse cx="62" cy="135" rx="38" ry="6" fill="#0005"/>

 <rect x="6" y="84" width="46" height="15" rx="5" fill="#3a3f4b"/><circle cx="6" cy="91" r="7" fill="#ffb000"/><circle cx="6" cy="91" r="12" fill="#ffb000" opacity=".3"/></svg>`;
}

/* ---------- интерфейс ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1500)}
function ui(){
 const st=stats(),n=S.cur,s=(n-1)%5+1,w=((n-1)/5|0)+1;
 $('#c1').textContent='💎 '+S.gems;$('#c2').textContent='🪙 '+fmt(S.gold);$('#c3').textContent='⚔ '+fmt(st.d*5+st.hp/2+st.ar*3);
 $('#lt').textContent='Уровень '+w+'-'+s;
 $('#lp').style.visibility=n>1?'visible':'hidden';$('#ln').style.visibility=n<S.n?'visible':'hidden';
 $('#dots').innerHTML=[1,2,3,4].map(i=>`<i class="${i<s?'on':''}"></i>`).join('')+'<b>💀</b>';
 $('#boss').style.display=(F&&F.fight)?'none':'block';
 $('#boss').innerHTML=s==5?'💀<small>БОСС</small>':'⚔<small>'+w+'-'+s+'</small>';
 $('#pl').textContent='Ур.'+S.pl;$('#xi').style.width=S.ol/need(S.pl)*100+'%';$('#xt').textContent='ящиков '+S.ol+'/'+need(S.pl);
 $('#s1').textContent='🔫 '+fmt(st.d);$('#s2').textContent='🛡 '+fmt(st.ar);$('#s3').textContent='❤ '+fmt(st.hp);
 $('#grid').innerHTML=SL.map(([k,ic],i)=>{const it=S.it[k];
  return it?`<button class="slot r${it.r}" data-k="${k}" style="border-color:${RC[it.r]};box-shadow:inset 0 0 10px ${RC[it.r]}88">${ART['slot'+i]?`<img src="${ART['slot'+i]}">`:`<span>${ic}</span>`}<em>Ур.${it.lv}</em></button>`
  :`<button class="slot e" data-k="${k}"><span>${ic}</span></button>`}).join('');
 document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{const k=b.dataset.k,it=S.it[k],d=SL.find(x=>x[0]==k);toast(it?`${RN[it.r]} · ${d[2]} ур.${it.lv}`:d[2]+': пусто, открывай ящики')});
 $('#cp').textContent='📦 '+S.cr;$('#chest').classList.toggle('z',S.cr<1);
 if(F){F.st=st;if(!F.fight){F.max=st.hp;F.hp=st.hp}F.he.innerHTML=hero()}
}
function rollR(){const mx=Math.min(8,1+Math.floor(S.pl/3)),k=Math.max(.7,2.2-.08*S.pl),w=[];let t=0;for(let r=0;r<=mx;r++){w[r]=Math.exp(-k*r);t+=w[r]}
 let x=Math.random()*t;for(let r=0;r<=mx;r++){x-=w[r];if(x<=0)return r}return 0}
$('#chest').onclick=()=>{
 if(S.cr<1)return toast('Ящиков нет. Проходи уровни и выполняй задания');
 S.cr--;S.qp.o++;
 const d=SL[Math.random()*SL.length|0],it={r:rollR(),lv:S.pl+(Math.random()*3|0)},cu=S.it[d[0]],eq=!cu||pw(it)>pw(cu),gain=Math.ceil(pw(it)*2);
 if(eq)S.it[d[0]]=it;else S.gold+=gain;
 S.ol++;let up='';if(S.ol>=need(S.pl)){S.ol=0;S.pl++;up='<div style="color:#ffd23f">Новый уровень '+S.pl+'!</div>'}
 const c=RC[it.r];
 $('#drop').innerHTML=`<div class="dc" style="border-color:${c};box-shadow:0 0 26px ${c}"><div style="font-size:44px">${d[1]}</div><div style="color:${c}">${RN[it.r]}<small style="display:block;font-size:13px">${RE[it.r]}</small></div><div>${d[2]} ур.${it.lv}</div><div style="font-size:16px">${eq?(cu?'▲ Лучше! Надето':'✔ Надето'):'Слабее · продано 🪙'+gain}</div>${up}</div>`;
 clearTimeout(drop.t);drop.t=setTimeout(()=>$('#drop').innerHTML='',1700);
 save();ui();
};
function drop(){}
document.querySelectorAll('.mb[data-t]').forEach(b=>b.onclick=()=>toast(b.dataset.t+': скоро'));
$('#lp').onclick=()=>{if(!F.fight&&S.cur>1){S.cur--;ui()}};$('#ln').onclick=()=>{if(!F.fight&&S.cur<S.n){S.cur++;ui()}};

/* ---------- задания ---------- */
const Q=[["k","Победить врагов",10,"⚔"],["w","Выиграть боёв",2,"🏆"],["o","Открыть ящиков",5,"📦"]];
function quests(){
 $('#mc').innerHTML='<h3>Задания</h3>'+Q.map(([k,nm,b,ic])=>{const tg=b*(1+S.qt[k]),rw=6+2*S.qt[k],ok=S.qp[k]>=tg;
  return `<div class="q"><div>${ic} ${nm}<small>${Math.min(S.qp[k],tg)}/${tg} · награда 📦×${rw}</small></div><button class="btn" data-q="${k}" ${ok?'':'disabled'}>Забрать</button></div>`}).join('')+'<div style="text-align:center;margin-top:10px"><button class="btn" id="mx" style="background:#ffd23f;border-bottom-color:#d19a00">Закрыть</button></div>';
 $('#modal').classList.add('on');
 $('#mx').onclick=()=>$('#modal').classList.remove('on');
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const k=b.dataset.q,q=Q.find(x=>x[0]==k),tg=q[2]*(1+S.qt[k]);if(S.qp[k]<tg)return;S.qp[k]-=tg;S.cr+=6+2*S.qt[k];S.qt[k]++;save();ui();quests()});
}
$('#qb').onclick=quests;

/* ---------- бой ---------- */
let F=null;
$('#boss').onclick=()=>{if(F&&!F.fight){wave();ui()}};
function wave(){
 const n=S.cur,s=(n-1)%5+1,boss=s==5,pwr=1+.22*(n-1),wd=((n-1)/5|0)%3,q=[];
 const mk=(big,hm,am,sp,ty)=>({hp:26*pwr*hm,at:(2.5+.7*n)*am,sp,big,ty,wd,gold:Math.ceil((1+n/2)*(big?5:1))});
 if(boss){q.push(mk(0,1,1,46,1),mk(0,1,1,46,2),mk(1,8,2,30,0))}
 else for(let i=0;i<3+s;i++)q.push(mk(0,1,1,46+Math.min(30,n*2),(i+n)%3));
 Object.assign(F,{q,t:0,sp:0,boss,hp:F.max,fight:1});
}
function start(){
 const sc=$('#scene'),st=stats(),he=document.createElement('div');
 he.className='ent';he.style.cssText='left:4%;height:42%;aspect-ratio:120/190';he.innerHTML=hero();sc.appendChild(he);
 F={st,hp:st.hp,max:st.hp,he,sc,q:[],en:[],cd:0,t:0,sp:0,last:performance.now(),fight:0};ui();requestAnimationFrame(loop);
}
function shoot(){
 const t=F.en.reduce((a,b)=>a.x<b.x?a:b),cr=Math.random()<.12,d=Math.round(F.st.d*(cr?2:1)*(.9+Math.random()*.2));
 F.cd=F.st.r;t.hp-=d;
 const H=F.sc.clientHeight,hx=F.he.offsetLeft+F.he.offsetWidth*.97,hy=H*.81-F.he.offsetHeight*.56;
 const tr=document.createElement('div');tr.className='tr';tr.style.cssText=`left:${hx}px;top:${hy}px;width:${Math.max(10,t.x+t.el.offsetWidth*.3-hx)}px`;F.sc.appendChild(tr);setTimeout(()=>tr.remove(),110);
 const f=document.createElement('div');f.className='dmg'+(cr?' c':'');f.textContent=(cr?'💥':'')+fmt(d);f.style.cssText=`left:${t.x+t.el.offsetWidth*.3}px;top:${hy-70}px`;F.sc.appendChild(f);setTimeout(()=>f.remove(),700);
 t.el.classList.remove('hit');void t.el.offsetWidth;t.el.classList.add('hit');
 F.he.classList.remove('recoil');void F.he.offsetWidth;F.he.classList.add('recoil');
 if(t.hp<=0){S.gold+=t.gold;S.qp.k++;t.el.remove();F.en.splice(F.en.indexOf(t),1);$('#c2').textContent='🪙 '+fmt(S.gold)}
}
function loop(now){
 const dt=Math.min(.05,(now-F.last)/1000);F.last=now;F.t+=dt;F.cd-=dt*1000;
 const W=F.sc.clientWidth;
 if(F.q.length&&F.t>F.sp){F.sp=F.t+(F.q[0].big?2.2:1.1);const e=F.q.shift();e.x=W+10;const el=document.createElement('div');el.className='ent walk';el.style.height=e.big?'48%':'31%';el.style.aspectRatio=e.big?'160/170':'120/140';el.innerHTML=foe(e.ty,e.big,e.wd);F.sc.appendChild(el);e.el=el;F.en.push(e)}
 const stop=F.he.offsetLeft+F.he.offsetWidth*.85;
 for(const e of F.en){const i=F.en.indexOf(e);if(e.x>stop+(i%3)*12){e.x-=e.sp*dt;e.el.classList.add('walk')}else{e.el.classList.remove('walk');F.hp-=Math.max(1,e.at*100/(100+F.st.ar*3))*dt}e.el.style.left=e.x+'px'}
 if(F.en.length&&F.cd<=0)shoot();
 F.he.classList.toggle('walk',!F.en.length);
 $('#hp').style.width=Math.max(0,F.hp/F.max*100)+'%';
 if(F.fight&&F.hp<=0){F.en.forEach(e=>e.el.remove());F.en=[];F.q=[];F.fight=0;F.hp=F.max;toast('Поражение! Открой ящики и усилься');save();ui()}
 else if(F.fight&&!F.q.length&&!F.en.length){
  F.fight=0;S.qp.w++;let m='Победа!';
  if(S.cur==S.n){const c=F.boss?8:3;S.cr+=c;S.n++;S.cur=S.n;m+=' +📦×'+c;if(F.boss)S.gems+=5}
  toast(m);save();ui();
 }
 requestAnimationFrame(loop);
}
start();
</script></body></html>
